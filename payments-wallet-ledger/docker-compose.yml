
services:
  postgres:
    image: postgres:17
    container_name: payments-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: payments_wallet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  payments-backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payments-wallet-api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/payments_wallet
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: qwerty
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: